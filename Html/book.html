<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>VYORA | Book Vehicle</title>

    <link rel="stylesheet" href="../Css/book .css">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <nav class="navbar">

        <div class="logo">

            <img src="../assets/logo.png" alt="Logo">

            <h2>VYORA</h2>

        </div>

        <ul>

            <li><a href="home.html">Home</a></li>
            <li><a href="explore.html">Explore</a></li>
            <li><a href="offers.html">Offers</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="contact.html">Contact</a></li>

        </ul>

    </nav>

    <section class="booking">

        <div class="booking-container">

            <div class="vehicle-box">

                <img id="vehicleImage" src="" alt="Vehicle">

                <h2 id="vehicleName"></h2>

                <h3 id="vehiclePrice"></h3>

            </div>


            <div class="booking-form">

                <h2>Book Your Vehicle</h2>

                <form>

                    <div class="input-box">

                        <label>Full Name</label>

                        <input type="text" placeholder="Enter your name" required>

                    </div>

                    <div class="input-box">

                        <label>Mobile Number</label>

                        <input type="tel" placeholder="Enter mobile number" required>

                    </div>

                    <div class="input-box">

                        <label>Email</label>

                        <input type="email" placeholder="Enter email">

                    </div>

                    <div class="input-box">

                        <label>Pickup Location</label>

                        <select>

                            <option>Coimbatore</option>
                            <option>Chennai</option>
                            <option>Madurai</option>
                            <option>Theni</option>

                        </select>

                    </div>

                    <div class="row">

                        <div class="input-box">

                            <label>Pickup Date</label>

                            <input type="date" id="pickupDate">

                        </div>

                        <div class="input-box">

                            <label>Return Date</label>

                            <input type="date" id="returnDate">

                        </div>

                    </div>

                    <div class="row">

                        <div class="input-box">

                            <label>Pickup Time</label>

                            <input type="time">

                        </div>

                        <div class="input-box">

                            <label>Return Time</label>

                            <input type="time">

                        </div>

                    </div>

                    <div class="input-box">

                        <label>Payment Method</label>

                        <select>

                            <option>UPI</option>
                            <option>Credit Card</option>
                            <option>Debit Card</option>
                            <option>Cash on Pickup</option>

                        </select>
                    </div>

                    <div class="summary">

                        <h3>Booking Summary</h3>

                        <p>Vehicle : <span id="summaryVehicle"></span></p>

                        <p>Price : <span id="summaryPrice"></span></p>

                        <p>Total Amount : <span id="totalAmount">₹0</span></p>

                    </div>

                    <div class="buttons">

                        <button type="button"
                            onclick="window.location.href='details.html'">

                            Back

                        </button>

                        <button type="button" id="confirmBtn">
                            Confirm Booking
                        </button>

                    </div>

                </form>

            </div>

        </div>

    </section>

    <!-- ================= FOOTER ================= -->

    <footer>

        <h2>VYORA</h2>

        <p>One Platform. Every Ride.</p>

        <p>© 2026 All Rights Reserved.</p>

    </footer>

    <script src="../Js/book.js"></script>

</body>

</html>
