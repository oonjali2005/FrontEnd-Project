<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | VYORA</title>

    <link rel="stylesheet" href="../Css/profile.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

</head>

<body>

    <!-- Navbar -->

    <nav class="navbar">

        <div class="logo">
            <img src="../assets/logo.png" alt="">
            <h2>VYORA</h2>
        </div>

        <ul>

            <li><a href="home.html">Home</a></li>

            <li><a href="explore.html">Explore</a></li>

            <li><a href="offers.html">Offers</a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="contact.html">Contact</a></li>

        </ul>

    </nav>

    <!-- Profile -->

    <section class="profile-section">

        <div class="profile-card">

            <img src="../assets/profile.png" id="profileImage">

            <h2 id="username">Ponnunjali</h2>

            <p id="userEmail">ponnunjali@email.com</p>

            <button id="editBtn">

                <i class="fa-solid fa-pen"></i>

                Edit Profile

            </button>

        </div>

        <div class="profile-details">

            <h2>Personal Information</h2>

            <div class="info">

                <label>Full Name</label>

                <input type="text" id="name"
                value="Ponnunjali">

            </div>

            <div class="info">

                <label>Mobile Number</label>

                <input type="text" id="mobile"
                value="+91 9876543210">

            </div>

            <div class="info">

                <label>Email</label>

                <input type="email" id="email"
                value="ponnunjali@email.com">

            </div>

            <div class="info">

                <label>Address</label>

                <textarea id="address">Coimbatore</textarea>

            </div>

            <button id="saveBtn">

                Save Changes

            </button>

        </div>

    </section>

    <script src="../Js/profile.js"></script>

</body>
</html>
